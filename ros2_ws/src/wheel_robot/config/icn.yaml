wheelleg_vision_race:
  ros__parameters:
    # 配置总则：每项注释均说明用途、单位、范围、调节效果与运行中限制。
    # 普通分组只在节点启动时读取。日常实时参数已单独放到 race_tuning.yaml，
    # 运行中只读取该文件的 live_tuning；本文件其他段的保存不会即时改变机器人。
    # 所有修改前确保小车安全停放、遥控急停可用；台阶接管期间禁止修改姿态/台阶开关。

    runtime:
      # 用途：是否发送真实底盘命令；范围 true/false；false=视觉干跑，true=可运动；启动参数，禁止运行中修改。
      enable_motion: true
      # 用途：HDMI/X11 显示调试画面；范围 true/false；false 减少显示负担但不改变算法；启动参数。
      show_debug: true
      # 用途：开始前是否等待 /race_start_confirm；范围 true/false；true 防误起步；启动参数。
      require_stand_confirmation: true
      # 用途：开始确认前站立稳定时间；单位秒，建议 0~10；增大更稳/减小更快；启动参数。
      stand_settle_seconds: 2.0
      # 用途：保存原始录像；范围 true/false；true 便于复盘但增加磁盘写入；启动参数。
      record_raw_video: true
      # 用途：保存带标注录像；范围 true/false；true 便于复盘但增加磁盘写入；启动参数。
      record_debug_video: false

    camera:
      # 用途：相机后端；范围 "v4l2"；错误会打不开相机；硬件启动参数。
      backend: "v4l2"
      # 用途：OpenCV 相机编号；单位整数，通常 0=/dev/video0；改错会取错设备；硬件启动参数。
      id: 0
      # 用途：相机设备节点；单位 Linux 路径，必须与 /dev/video* 一致；硬件启动参数。
      device: "/dev/video0"
      # 用途：图像宽度；单位像素，建议相机支持值；增大更清晰但更耗算力；硬件启动参数。
      width: 640
      # 用途：图像高度；单位像素，建议相机支持值；增大更清晰但更耗算力；硬件启动参数。
      height: 480
      # 用途：采集帧率；单位 Hz，建议 15~30；增大更灵敏但可能掉帧；硬件启动参数。
      fps: 30.0
      # 用途：相机输出格式；范围相机支持格式，本车为 YUYV；改错可能无图；硬件启动参数。
      pixel_format: "YUYV"
      # 用途：画面旋转；单位度，常用 0/90/180/270；只在画面方向错时修改；启动参数。
      rotation_degrees: 0
      # 用途：画面镜像；范围 "none" 或支持值；左右反向才改；启动参数。
      mirror_mode: "none"
      # 用途：控制循环频率；单位 Hz，建议 10~30；当前与30fps相机对齐，每帧尽量都有一次控制机会。
      control_rate: 30.0

    drive:
      # 提示：真实直道/最低/最大转向速度只在 live_tuning 设置，避免两处覆盖。
      # 用途：弯道降速强度；无单位，建议 0~1；增大更慢更稳，过大太慢；启动参数。
      curve_slowdown: 0.72
      # 用途：线速度平滑上限；单位 m/s²，建议 0.1~1.0；增大起停更快，减小更平稳；启动参数。
      linear_accel: 0.42
      # 用途：角速度平滑上限；单位 rad/s²，建议 0.5~5.0；增大转向更快，过大会摆动；启动参数。
      angular_accel: 2.50
      # 用途：大弯丢线后按上次方向找线最长时间；单位秒，建议 0.2~2；增大不早停，过大盲走；启动参数。
      big_turn_loss_seconds: 1.00
      # 用途：大弯丢线找线前进速度；单位 m/s，建议 0.03~0.15；增大更快，过大压边；启动参数。
      big_turn_loss_speed: 0.075
      # 用途：大弯丢线找线角速度；单位 rad/s，建议 0.05~0.60；增大转更紧，过大甩出；启动参数。
      big_turn_loss_turn: 0.34

    roundabout:
      # 提示：真实环岛前进/出环速度只在 live_tuning 设置。
      # 用途：固定进环左转角速度；单位 rad/s，建议 0.1~0.8；增大半径更小，过大压边；启动参数。
      left_turn_speed: 0.34
      # 用途：每圈允许识别环岛前的最小里程；单位 m，建议 0.2~3；增大抗误检，过大会漏近环岛；启动参数。
      arm_after_start_distance: 1.00
      # 用途：第一圈看到入口后继续循迹距离；单位 m，建议 0.2~3；增大晚转，减小早转；启动参数。
      first_lap_approach_distance: 1.20
      # 用途：第二圈看到入口后继续循迹距离；单位 m，建议 0.2~3；规律同第一圈；启动参数。
      second_lap_approach_distance: 1.20
      # 用途：第二圈是否只用第一圈位置推算；范围 true/false；false 必须重新看线、更抗里程误差；启动参数。
      second_lap_use_first_position: false
      # 用途：位置推算时的额外前移；单位 m；增大晚进环；当前上项为 false 时不生效；启动参数。
      second_lap_advance: 0.00
      # 用途：固定左转进环保持距离；单位 m，建议 0.2~2；增大易绕过头，减小可能没进；启动参数。
      entry_turn_distance: 1.00
      # 用途：进环固定左转时间兜底；单位秒，建议 1~12；增大可能多绕；启动参数。
      entry_max_seconds: 7.0
      # 用途：环岛内找出口时间兜底；单位秒，建议 5~40；增大不早出，过大可能卡环；启动参数。
      follow_max_seconds: 28.0
      # 用途：出环限制大右转保护时间；单位秒，建议 0.2~3；增大不回环，过大错后续线；启动参数。
      exit_commit_seconds: 1.20
      # 用途：出口丢线低速前进；单位 m/s，建议 0.03~0.2；增大更快，过大越界；启动参数。
      blind_recovery_speed: 0.10
      # 用途：出口丢线缓左转；单位 rad/s，建议 0.03~0.5；增大回赛道更快，过大会压边；启动参数。
      blind_recovery_left_turn: 0.16
      # 用途：蓝边界护栏速度；单位 m/s，建议 0.02~0.12；增大脱离快但风险高；启动参数。
      blue_guard_speed: 0.045
      # 用途：蓝边界护栏转向；单位 rad/s，建议 0.1~0.6；增大转回快，过大会摆；启动参数。
      blue_guard_turn_speed: 0.30

    crosswalk:
      # 用途：确认横道后继续巡线到停车点距离；单位 m，建议 0.05~0.8；增大停更后，减小停更前；启动参数。
      approach_distance: 0.30

    yellow_line:
      # 用途：比赛总圈数；单位正整数；增大多跑圈、减小早结束；启动参数。
      total_laps: 2
      # 用途：黄色终点连续确认帧；单位帧，建议 1~10；增大抗误检，过大漏检；启动参数。
      confirm_frames: 5
      # 用途：横道后恢复终点识别的延迟；单位秒，建议 0~3；增大抗余纹误检，过大晚识别；启动参数。
      detect_delay_after_crosswalk: 0.90
      # 用途：找横道时是否以黄线作漏检兜底；范围 true/false；false 必须横道停车；启动参数。
      accept_while_seek_crosswalk: false
      # 用途：最后一圈黄线后冲过距离；单位 m，建议 0.2~3；增大不在线上停，过大越界；启动参数。
      finish_pass_distance: 1.50

    step:
      # 用途：起跳前是否等回车；范围 true/false；true 更安全，false 连续自动跳；启动参数，未验证前保持 true。
      manual_confirm_before_jump: true
      # 用途：接近台阶冲刺速度；单位 m/s；增大动量更大但落地风险高；跳跃参数，运行中禁止改，先架空测试。
      approach_speed: 0.70
      # 用途：跳跃脉冲前进速度；单位 m/s；增大前冲强，过大不稳；跳跃参数，运行中禁止改，先架空测试。
      jump_forward_speed: 0.70
      # 用途：到原起跳点后，保持起跳姿势和直线初速度的助跑时间；单位秒。
      takeoff_run_seconds: 0.15
      # 用途：跳跃低位腿高；单位 m，建议 0.14~0.36；减小压缩更多；跳跃参数，运行中禁止改。
      jump_min_height: 0.15
      # 用途：跳跃高位腿高；单位 m，建议 0.14~0.36；增大跳高，过大落地不稳；跳跃参数，运行中禁止改。
      jump_max_height: 0.33
      # 用途：固定冲刺总距离；单位 m；增大更晚跳，减小更早跳；跳跃参数，运行中禁止改。
      sprint_distance: 0.61
      # 用途：提前触发补偿；单位 m；增大更早跳，减小更晚跳；跳跃参数，运行中禁止改。
      jump_trigger_lead: 0.035
      # 用途：深度到此距离开始准备；单位 m；增大更早准备，减小更近准备；跳跃参数，通常不动。
      start_depth: 0.70
      # 用途：本圈小于此里程不许台阶接管；单位 m；增大抗早期误检，过大漏台阶；跳跃参数。
      arm_min_seek_distance: 1.25
      # 用途：本圈大于此里程不许台阶接管；单位 m；增大允许更晚检测，过大误检；跳跃参数。
      arm_max_seek_distance: 3.20
      # 用途：第二圈台阶前速度上限；单位 m/s；减小更稳，增大更快；跳跃参数。
      second_lap_speed_cap: 0.16
      # 用途：跳后找线最长时间；单位秒；增大找线更久，过大盲走；跳跃参数。
      post_reacquire_seconds: 3.8
      # 用途：跳后找线最大前进距离；单位 m；增大范围更大，过大越界；跳跃参数。
      post_reacquire_distance: 0.38
      # 用途：跳后找线速度；单位 m/s；增大更快，减小更稳；跳跃参数。
      post_reacquire_speed: 0.055
      # 用途：跳后找线转向；单位 rad/s；负右正左，绝对值增大转更快；跳跃参数，先确认方向。
      post_reacquire_turn: -0.24
