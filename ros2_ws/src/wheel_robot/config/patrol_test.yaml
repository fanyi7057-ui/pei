# V13：VV虚线1帧检测；沿底部主路先通过5号出口岔口，从4号入环、5号出环。
# 必须更新两个Python与整套新YAML后重启一次；以后保存参数无需编译/重启。
# 误差仍为横向偏移/半图宽，不是弧度；不要覆盖回V2/V3旧参数表。
# 包内robot_menu的4运行本测试；原比赛在5，已调好台阶源文件不变；本测试不执行跳跃。
# 先用“视觉干跑”检查绿色中线，再低速实车；遥控急停保持可用。
# 开关必须写0/1；任何错误都会整套拒绝并在终端说明，不静默改成其他速度。
patrol_test:
  # ===== A. 日常优先：速度与中心位置 =====
  # 总开关：1运行、0停车；0时保持正常姿态。再次设1可能恢复运动，务必安全停放后改。
  enabled: 1
  # 普通巡航上限，m/s；起步、弯道、环岛与丢线分别受下方上限约束。
  # 无额外数值上限，必须有限非负；0不前进但仍可转向。增加速度不能保证急弯可过。
  fixed_speed_m_s: 0.40
  # 分场景限速；均不超过巡航目标，普通 PD 参数不变。0仅供旧控制器对照测试。
  adaptive_speed_enabled: 1
  startup_speed_m_s: 0.20
  bend_speed_m_s: 0.28
  sharp_bend_speed_m_s: 0.25
  lost_speed_m_s: 0.10
  roundabout_speed_m_s: 0.30
  speed_stable_seconds: 0.50
  speed_stable_confidence: 0.65
  bend_preview_error: 0.18
  bend_release_seconds: 0.50
  linear_decel_m_s2: 1.20
  # 目标中心=图宽比例，参考7.25：0.50正中，0.51右移1%图宽，0.49左移1%。
  # 黑线/轮廓统一使用；同一画面下增大此值让转向更偏左，减小更偏右。
  # 这不是固定转向偏置；范围0..1，建议每次只调0.005~0.01，停车后保存。
  target_x_ratio: 0.50

  # ===== B. 普通/急弯转向：PD不变，线速度由A段规划器独立限制 =====
  # 比例P：rad/s每单位归一化横向误差，有限非负、无数值上限。
  # 默认1.08沿用基线；增大咬线更强，过大摆动；不要照搬旧角度误差的4.0。
  steering_gain: 1.08
  # 微分D：抑制误差快速变化，有限非负；0关闭。过大也会放大噪声。
  steering_kd: 0.018
  # 当前误差滤波权重：(0,1]；默认0.48沿用基线，增大更快、减小更柔但滞后。
  # 急弯随强度减轻滤波，近端单带救线直接用当前误差；换源/失线恢复不制造微分冲击。
  error_filter_alpha: 0.48
  # 微分项使用的误差变化率上限，单位归一化误差/s，有限非负；0禁用D变化。
  # 不是速度上限。默认3.0沿用基线，增大响应尖锐、过大放大噪声。
  max_error_derivative: 3.0
  # 最大转向角速度，rad/s，有限非负，无额外上限；0禁止转向。只限制转向，不降线速度。
  max_turn_rad_s: 2.0
  # 加速变化率，m/s²；减速用linear_decel_m_s2，丢线安全上限立即生效。
  linear_accel_m_s2: 0.35
  # 转向变化率，rad/s²，>0；增大反应快、减小柔和但有延迟。
  angular_accel_rad_s2: 3.0
  # 急弯增强起始误差，归一化0..1；默认0.25。大于此值逐渐启用更强转向。
  # 减小会更早增强，过小可能直线也摆；必须小于corner_full_error。
  corner_start_error: 0.25
  # 急弯满转向误差，(start,1]；默认0.70，达到后比例目标能用到max_turn_rad_s。
  # 不是固定左转：方向由当前路径误差决定；增大更温和，减小更早强转。
  corner_full_error: 0.70
  # 急弯/主动找线转向变化率，rad/s²，>0；默认10.0，减少旧方向残留。
  # 普通小误差仍用angular_accel_rad_s2；增大更快但过大抽动，仍受max_turn_rad_s约束。
  corner_angular_accel_rad_s2: 10.0
  # 卸掉旧转向/回正的变化率，rad/s²，>0；默认10，修复强转后仍拖着旧方向。
  # 增大回正更及时，过大生硬；与建立新方向分开，跨零时本帧不直接反向打满。不改变线速度。
  unwind_angular_accel_rad_s2: 10.0
  # 单带救线获得完整急弯增强所需置信度，(0,1]；默认0.55。
  # 低于此值仍救线，但按置信度减弱增强；增大更抑制边缘噪声，过大会削弱真急弯。
  rescue_corner_confidence: 0.55
  # ===== C. 黑线主导 / 轮廓补线 / 短失线 =====
  # 黑线主巡线开关，0/1；用原包黑线掩膜和路径提取，只跳过原比赛速度分支。
  black_enabled: 1
  # 普通黑线最低可信度，0..1，默认0.26对齐基线；增大更易交给轮廓。
  # 基线认可的近端单带救线单独保留，不用提高全局门槛把急弯真线丢掉。
  black_min_confidence: 0.26
  # 蓝背景白赛道轮廓补线开关，0/1；0仅黑线，1黑线失效时启用轮廓法。
  contour_enabled: 1
  # 从轮廓切回黑线前连续确认的新帧数，1..20；减少切换抖动，不重复计旧图。
  black_return_frames: 3
  # 换源有界交接时间，s，>=0；0立即切换，不叠加差值放大误差。
  # 近端单带救线立即接管；这不是强制偏转/延迟打方向几秒。
  handoff_seconds: 0.15
  # 同一黑线相邻新帧反向突跳阈值，归一化误差(0,1]；默认0.65。
  # 超过且跨左右两侧时先短时续行，不立刻相信另一条线；减小更抗跳线，过小会延误真S弯。
  path_jump_error: 0.65
  # 上述突跳需要连续一致多少新帧，整数1..20；默认2帧，不停车、不重置速度；1关闭确认。
  path_jump_confirm_frames: 2
  # 道路近端中线相对最近可信路径允许横移多少图宽，0..1。
  # 默认0.25；减小抗跳支但可能拒绝急弯，增大放宽补线。只筛路径，不暗中降速。
  road_max_near_jump_ratio: 0.25
  # 道路仅剩单侧边界时，借用上次双边观测路宽的最长秒数，>=0；0禁用单边补线。
  # 默认0.40；单边续行不延长此期限；无历史路宽/全白时不拿画面边缘伪造路宽。
  road_single_edge_hold_seconds: 0.40
  # 黑线正常时每隔多少秒额外采样一次轮廓双边路宽，秒>0，默认0.20（约5Hz），不是录像。
  # 只缓存与黑线一致的真实双边宽度；突然只剩一边时可借用上面0.40秒，不等失线才学习路宽。
  # 减小更及时但多耗图像计算；增大更省时但近弯路宽可能较旧。探测不抢走可信黑线控制。
  road_width_probe_seconds: 0.20
  # 没有明确急弯方向时，先保持已输出指令的秒数，>=0；到期进入主动找线，不再直接停走。
  # 若近期已有明确急弯方向，直接主动找线；全程不因切换重启速度，盲区是否趋近巡航由maintain开关决定。
  loss_hold_seconds: 0.80
  # 持续找线开关，0/1；1=短记忆后继续找线，0=只允许上面短记忆。
  # 关闭后超时属于定位故障，仍需人工确认；本开关不取消相机/通信故障保护。
  search_enabled: 1
  # 同一次无定位/未确认重获允许总秒数，>0；默认3.0，从最后一次可信跟踪算起。
  # 一帧闪现不续期；到期故障清零并等人工输入1，不自动停起循环。不是普通弯道降速参数。
  search_max_seconds: 3.0
  # 同次找线允许最大累计指令行程，m，>0；默认1.8（原1米在0.65下约1.54秒就触发）。
  # 与上方3秒先到任一个仍故障等待；约2.77秒盲走已不短，不取消无定位保护/急停。
  # 这是按已输出速度积分，不是odom实测；提高意味着允许更远盲走，必须在清场下测试。
  search_max_distance_m: 1.8
  # 主动找线最小转向强度，rad/s，>=0；默认0.80。沿近期明确弯向，仍受max_turn_rad_s约束。
  # 有明确更强弯向时保留强度；线速度是否继续趋近目标由maintain开关决定。
  search_turn_rad_s: 0.80
  # 没有近期明确转向证据时的默认方向：1左、-1右；默认左。
  # 初始完全没看到路径时不会盲起步，这个方向只用于已经开始巡线后的找线。
  search_default_direction: 1
  # 找线后连续多少个真实新帧才回到正常跟踪，整数1..20；默认3。
  # 确认期间已有新路径可纠方向；单帧重获不清空预算或重置为零。maintain=1仍平滑趋近巡航目标。
  reacquire_confirm_frames: 3
  # 仅adaptive_speed_enabled=0旧对照模式时有效；V13分场景限速始终优先。
  # 修复起步遇到反复短失线后卡在0.02/0.2等低速；1意味着短盲区可能继续加速，仍受3s/1m保护。
  # 从未有可信路径时仍不盲起步；不是第二圈速度档位，每圈同一速度。
  maintain_cruise_during_search: 1
  # 取帧后允许图像最大年龄，s，>0；计算前后均检查，超时立即停车，不能靠重发旧图一直跑。
  image_timeout_seconds: 0.35

  # ===== D. 白赛道二值化：轮廓不对才调，黑线提取仍沿用基线 =====
  # 道路ROI上/下边界，占整图高度0..1；小=更远，大=更近，必须top<bottom。左右不裁剪避免漏急弯。
  roi_top_ratio: 0.25
  roi_bottom_ratio: 0.98
  # 蓝背景HSV阈值；H范围0..179，S/V范围0..255；扩大H范围可接纳更多蓝色，但可能误排道路。
  blue_h_min: 90
  blue_h_max: 140
  # 蓝色最低饱和度/亮度；降低可纳入更浅/更暗蓝背景，但更易误判。
  blue_s_min: 90
  blue_v_min: 35
  # 反光/褪色弱蓝最低饱和度，整数0..255；默认25，仍须满足蓝色H和下方B-R差值。
  # 降低接纳更浅蓝，也更容易误排冷色白路；不是把所有低饱和像素判蓝。
  blue_weak_s_min: 25
  # 弱蓝B通道比R至少高多少，8位像素整数0..255；默认8。增大更保守，减小更能排除灰蓝岛。
  blue_weak_br_delta: 8
  # 没有强蓝核心的弱蓝连通块最小面积，占分析图面积(0,1]；默认0.005。
  # 有强蓝核心的薄分隔带仍保留；增大抗零碎色噪声，过大漏小蓝块。暖白/中性白不会仅凭亮度判蓝。
  blue_weak_min_area_ratio: 0.005
  # 蓝区周边亮度对比的邻域半径，占图宽(0,1]；默认0.10。增大能约束宽反光，也可能影响阴影路面。
  blue_context_radius_ratio: 0.10
  # 附近蓝色覆盖>=20%时，白候选需比蓝区平均灰度至少亮多少，整数0..255；默认25，0关闭此约束。
  # 用于排除蓝岛内无色灰反光；增大更保守，过大会漏阴影白路。不可把任意反光保证识别成蓝色。
  road_blue_contrast_gray: 25
  # 白路面最高饱和度/最低亮度，0..255；放宽可覆盖阴影，但可能把其他地面当道路。
  # 最终二值图=蓝背景反相 AND 白路面；不是把现有黑线二值图直接取反。
  white_s_max: 110
  white_v_min: 90
  # 小缺口闭运算核，奇数1..9像素；1关闭；处理后会重新扣除蓝色禁行区，不允许填蓝岛。
  close_kernel_px: 3
  # 水平方向允许补合的中性暗色胶带间隙，处理图像像素，整数0..40；0关闭。
  # 只补有限宽度暗色缝，不填整个外轮廓，不跨蓝色区域；过大会把非蓝色暗物体误接成道路。
  black_gap_fill_px: 12
  # 从近向远追同一白色通道时，每行允许中点横移的最大比例，0..1且>0，乘处理图像宽度。
  # 减小更抗跳支、但急弯可能提取不足；增大更能接急弯，但更易跳到旁边白路。
  road_max_row_step_ratio: 0.08
  # 道路中线对最近可信路径参考的权重，0..1；0只按当前白路中点，增大更保持原通道。
  # 仅在历史未超过loss_hold_seconds且参考行可用时生效；不能替代环岛任务路线选择。
  road_history_weight: 0.25
  # 道路候选最小面积，占ROI面积0..1；增大抗噪声，过大漏窄弯。
  min_road_area_ratio: 0.04
  # 近端道路种子起始高度，占ROI高度0..1；默认0.85。
  # 近端少量缺口时会有限上移种子带，不去追任意远处白块，范围由road_near_gap_ratio限制。
  seed_bottom_ratio: 0.85
  # 种子左右半宽，占图宽0..1，中心沿用最近可信路径；增大容易接上路，也易选错分支。
  seed_half_width_ratio: 0.15
  # 每行白道路最小宽度，占图宽0..1；增大拒绝细碎白块，过大漏远端窄道路。
  min_road_width_ratio: 0.12
  # 至少多少ROI行必须有可见道路边界，0..1且>0；可信双边路宽也用此比例筛选。
  # 全白不伪造中线；单边需要近期双边宽度支持。
  min_observed_rows_ratio: 0.20
  # 左右边界短缺行插值上限，0..40行；0不补，增大跨缝更强但更易虚构弯道。
  max_repair_gap_rows: 6
  # ===== E. 道路轮廓预瞄行：近端主导，避免平均远弯导致提前切弯 =====
  # 理想近端行：占整图高度0..1，大=更近；默认0.86。
  road_near_y_ratio: 0.86
  # 真实道路边界暂缺近端多少图高仍可使用最近真实观测，0..(near-mid)，默认0.18。
  # 增大减少no_center_in_error_rows，但过大预瞄变远。必须仍有真实边界，不补造全白，不跨已知蓝区。
  road_near_gap_ratio: 0.18
  # 中端行：默认0.60，辅助航向，不能推翻近端位置；必须远<中<近且在ROI内。
  road_mid_y_ratio: 0.60
  # 远端行：默认0.38，只弱辅助形状判断，不用全图平均直接拉方向。
  # 黑线仍用原提取器的近/中/远与单带语义，不受道路采样行二次否决。
  road_far_y_ratio: 0.38

  # ===== F. 环岛任务：先选左侧道路，再由统一巡线控制，不是全程强制左转 =====
  # 0只测普通巡线（须同时关闭横道以免误解任务），1开启环岛入口/内部/出口；默认1。
  # 任务接管中不能关，先按3重置新场再改。横道在本圈正常出环或时间兜底后开启；原台阶文件保留，此入口不跳。
  roundabout_enabled: 1
  # 从本次输入1后首次处理新图开始计时，s>=0；默认6。前6秒不运行入口检测、不累计入口证据。
  # 与下方距离同时满足；暂停时间不计入。本参数可保存实时调整。
  roundabout_arm_seconds: 6.0
  # 开始后至少前行多少米才找入口，m>=0；默认1。优先用新鲜odom，无odom则用已发速度积分，日志明确来源。
  roundabout_arm_distance_m: 1.0
  # 历史参数名兼容：现在只控制30/45秒诊断报警，不释放环岛/不开放横道。
  roundabout_timeout_enabled: 1
  # 第一圈诊断报警期限，秒；不是环内绕行时间。暂停不计时，到点不会假装出环。
  roundabout_first_timeout_seconds: 30.0
  # 第二圈诊断报警期限，秒，从第一次横道确认算；不触发任务释放。
  # 包含横道停车/清线时间，人工暂停不计；第二次识别仍必须等第一次清线结束；可实时改。
  roundabout_second_timeout_seconds: 45.0
  # 沿用原比赛虚线链检测（不是任意三个黑块）的强/弱分数，0<=weak<=strong<=1；增大减少误判但更易漏。
  roundabout_gate_strong_score: 0.82
  roundabout_gate_weak_score: 0.78
  # 入口/返回出口证据触发值，>0且<=5；强帧+1、弱帧+0.35、无证据-0.30，最多5；默认2.4。
  # 增大需要更多证据；不是到时间就自动进/出环。入口只在SEEK判，出口只在FOLLOW判。
  roundabout_gate_evidence: 2.4
  # 远处虚线确认后进入APPROACH，至少继续走m>=0，默认0.05；旧0.40可能走过近场窗口。
  # 还必须有近场新帧证据才入环；进早加大、进晚减小。普通巡线参数不变。
  roundabout_approach_distance_m: 0.05
  # 入口虚线链最近块的下沿必须到达整图高度比例(0,1]，默认0.66；增大等更靠近后才左选路。
  roundabout_entry_gate_near_ratio: 0.66
  # 已确认入口候选后，近场虚线链需累计几个真实新帧，整数1..20，默认2；弱分数仍须>=weak。
  # 不要求近处每帧完整5块；不是任意黑块或单根横道条就能入环。
  roundabout_entry_confirm_frames: 2
  # 近场证据跨短暂缺帧保留的秒数，>0，默认0.25；过期清空，不允许候选永远有效。
  # 减小更严，增大更抗近场虚线出画但误用旧证据风险更高；暂停立即清空。
  roundabout_entry_near_hold_seconds: 0.25
  # 接近阶段最长s>0，默认8；仍未确认近场就取消本候选、继续正常巡线并短暂抑制重触发，不盲转。
  roundabout_approach_max_seconds: 8.0
  # 入环锁定至少持续s>=0，默认0.6；必须同时满足下方距离、左转进展和稳定路径，不能只等时间。
  roundabout_entry_min_seconds: 0.6
  # 入环锁定至少前进m>=0，默认0.45；增大锁定更久，过大可能错过内线。不是旧固定左转1m。
  roundabout_entry_distance_m: 0.45
  # 入环至少累计左转进展rad>=0，默认0.35；新鲜odom用偏航变化，否则用已发角速度积分，不冒充实测。
  roundabout_entry_min_yaw_rad: 0.35
  # 路线稳定/虚线离开视野的确认新帧数，整数1..20；默认3。增大更稳，过大更晚切阶段。
  roundabout_path_confirm_frames: 3
  # 环内至少s>=0才允许判出口，默认2（V5的8秒不适合当前固定速度）；时间、行程、净转向和视觉同时满足。
  roundabout_follow_min_seconds: 2.0
  # FOLLOW内至少走m>=0，默认0.50；增大防入口马上当出口，过大错过出口。
  roundabout_follow_min_distance_m: 0.50
  # 从ENTRY开始累计净左转至少rad>=0，默认1.5；右转会抵消，左右摆动不伪造完整环行。
  roundabout_exit_min_yaw_rad: 1.5
  # 出口允许“返回虚线证据”或“连续近场实线”两条视觉证据；实线分数门槛(0,1]，默认0.65。
  # 仍要求虚线离开过、时间/进展门控及连续新帧，不是看见任何实线就出环。
  roundabout_exit_solid_score: 0.65
  # 实线出口框中心最大横向比例(0,1]，默认0.65，排除最右支；增大更宽松，过大抓右出口。
  roundabout_exit_left_max_ratio: 0.65
  # 单次环内跟随最长s>min，默认28；兜底开启时到期停止环岛选路，普通巡线等30/45秒期限。
  # 兜底关闭时仍按原任务故障停车；均不假装视觉出环，不取消真正失线/相机故障保护。
  roundabout_follow_max_seconds: 28.0
  # 锁定左出口后稳定循迹至少走m>=0，默认0.45；增大防重新抓右支，过大出口后锁太久。
  roundabout_exit_distance_m: 0.45
  # 单次入环/出口锁定最长s>entry_min，默认10；兜底开启时先释放强制选路，普通巡线等总期限。
  # 不允许永久盲左转；兜底关闭时超时故障等待人工。
  roundabout_route_max_seconds: 10.0
  # 出口后下一环最早释放时间/距离；横道开启时必须先完成本圈横道停车及清线，再满足这些门控。
  # 不会单靠12秒到时重新进环；横道关闭时才使用旧COOLDOWN独立循环。
  roundabout_rearm_seconds: 12.0
  roundabout_rearm_distance_m: 3.0
  # 入环建立左转/入口出口无路线时的左找线角速度rad/s>=0，默认0.8；受显式max_turn_rad_s约束。
  # ENTRY累计左转达到entry_min_yaw前先向左建立入口，取消旧右转残留；之后按已选路径纠偏。
  # 此段仍有route_max_seconds故障边界，不永久盲转；普通巡线与出口不强加固定左转。
  roundabout_search_turn_rad_s: 0.8
  # 仅ENTRY固定左转，A方案：0.8×1.5=1.2rad/s；不是线速度，也不改变丢线搜索。
  roundabout_entry_turn_rad_s: 1.2
  # 先识别汇聚的5号出口标记；计时内继续沿可见主虚线巡线，不停车。
  # 时间和实际前进距离必须同时满足，且标记已离开，才允许从发散的4号进入。
  roundabout_first_marker_cooldown_seconds: 1.0
  roundabout_first_marker_pass_distance_m: 0.20
  # ===== F1. 当前唯一入口检测：移植 vv 的小黑块/白色两侧/竖向间隔判据 =====
  # 一帧里至少几个黑色短块，不是确认帧数；横道长条、大黑块不计入。
  vv_dash_min_blocks: 4
  # 入口虚线确认帧数：按要求1帧。路径咬线确认仍独立保留，不能把一帧当绕行完成。
  vv_dash_confirm_frames: 1
  # 全图高度比例，0为顶部，1为底部；只在这块区域提取虚线。
  vv_dash_roi_top_ratio: 0.22
  vv_dash_roi_bottom_ratio: 0.90
  # 以80x56参考图计量，内部按实际分辨率适配；不是320x240原图像素。
  vv_dash_max_x_spread_px80: 18.0
  vv_dash_min_gap_rows56: 3.0
  # ===== F2. 陀螺仪保底出环：仅真实 FOLLOW 内积分；不是到角度就报完赛 =====
  ring_gyro_exit_enabled: 1
  ring_gyro_exit_degrees: 360.0
  # 必须有新鲜里程计实测前进这么远，并满足原环内最短2秒，原地转圈不算。
  ring_gyro_min_distance_m: 0.80
  # IMU过期不积分/不触发；有效速度上限排异常，死区抑制零漂，rad/s。
  ring_gyro_timeout_seconds: 0.20
  ring_gyro_rate_limit_rad_s: 8.0
  ring_gyro_deadband_rad_s: 0.03
  # 满足保底条件后直行找出口实线的时间，秒；仍需视觉确认才完成出环。
  ring_gyro_exit_seek_seconds: 1.0
  # 下方fork/chain阈值仅为历史回归工具兼容保留，V13运行入口不读取它们。
  # 旧入口分叉工具的兼容参数，不参与V13实际入口触发。
  roundabout_fork_change_ratio: 0.06
  roundabout_fork_confirm_frames: 3
  # 黑线与任务已选道路近/中误差允许差值，归一化(0,1]，默认0.30=15%图宽。
  # 超出则拒绝黑线抢回直行/右支；减小更严格，过小会拒绝真实内线。不是固定画面中心左偏。
  roundabout_path_agreement: 0.30
  # 环岛任务阶段中端方向预瞄权重，0..1；默认0.60，误差=near+权重*(mid-near)。
  # 只在已确认环岛任务内生效，普通巡线不变；增大更早沿所选分支转，过大切弯，减小可能反应晚。
  roundabout_heading_gain: 0.60
  # 已确认ENTRY/EXIT左分支的近端预引导：0关闭、1开启；仅左选路阶段用，不影响普通巡线。
  # 从近端可信种子到最近可见分叉左通道中点作中心引导，每个像素仍须位于真实白路/非蓝区。
  # 避免追到蓝岛尖端才突然切左失败；不是任意连接左右拐点，也不会画一条穿蓝岛的假路。
  roundabout_left_preview_enabled: 1

  # ----- F1. 入环确认：不要求看见蓝岛，也不凭“任意一根黑线”交接 -----
  # 入环近/中端真实路线连续稳定时长，秒>0且<route_max_seconds，默认0.20。
  # 同时满足原入环时间/行程/转角/帧数才交给FOLLOW；增大更稳但确认更晚，不是额外固定左转时间。
  roundabout_entry_stable_seconds: 0.20
  # 稳定期相邻帧近/中误差允许变化，归一化(0,1]，默认0.18=9%图宽；过小高速易反复清零。
  # 单带救线/缺近端不能证明已抓住环内路线；缺蓝岛本身不扣分、不阻止交接。
  roundabout_entry_path_delta: 0.18
  # 入/出环稳定路径相邻新帧最大间隔，秒>0，默认0.20；超过即重新确认，防陈旧帧凑满次数。
  # 低处理帧率时先查process/age，不建议单靠加大本项掩盖相机或处理延迟。
  roundabout_path_max_gap_seconds: 0.20

  # ----- F2. 环内跟随：沿已选路线左右纠偏，不重新按白区大小选路 -----
  # 已确认路线的近/中几何保留秒数>0，默认1.20；跨ENTRY->FOLLOW保留，不因普通路径缓存清空而丢失。
  # 超期不代表允许任意右侧线接管；继续有界左找线，仍受原3秒/1.8米保护，不永久盲转。
  roundabout_route_memory_seconds: 1.20
  # 新候选与近期目标近/中误差最大差，归一化(0,1]，默认0.30=15%图宽。
  # 增大更宽松易抓外线，减小更严易拒绝真实变化；不禁止目标路线连续地向右纠偏。
  roundabout_route_max_delta: 0.30

  # ----- F3. 低分入口的跨帧关联：只作用找入口/接近，不放宽出口或横道 -----
  # 0只用原强弱分数；1允许同一纵向虚线链连续出现时补充入口证据，默认1。
  # 仍至少5块、跨度>=22%图高、有规律间隔/形状；随机黑块/单条横道不行，不要求蓝岛出现。
  roundabout_gate_tracking_enabled: 1
  # 原始分数最低值，0..gate_weak_score，默认0.70；调低更易漏入的候选被跟踪，也更易误判。
  # 原gate日志不篡改，gate_tracked=1表示额外通过连续关联，不是把原始分数伪装成高分。
  roundabout_gate_track_min_score: 0.70
  # 同一链需要连续新帧，整数2..20且至少跨0.08秒，默认4；增大更严但高速更晚。
  roundabout_gate_track_frames: 4
  # 相邻关联帧最大间隔，秒>0，默认0.20；超时/暂停/重置清空，不积攒陈旧候选。
  roundabout_gate_track_max_gap_seconds: 0.20
  # 同一链在60%图高处拟合横坐标允许相邻变化，占图宽(0,1]，默认0.10。
  # 增大更抗高速视角变化，也更易把不同链串起来；数量/近端高度变化另有结构检查。
  roundabout_gate_track_max_x_ratio: 0.10

  # ----- F4. 出环拐点补线：只有EXIT阶段启用，不凭一个拐点触发出环 -----
  # 0沿用左通道预引导；1尝试“左通道内侧右拐点->同通道上方左边界点”作虚拟右边线。
  # 左边线仍用实测边界，重新算中线；连线/中线必须落在连通白路内、不跨已知蓝色。
  # 找不到可靠拐点/边界则不造线，回到已验证左路线；FOLLOW不使用这项强行出环。
  roundabout_exit_corner_enabled: 1
  # 拐点与上方目标点至少跨多少整图高度，(0,1]，默认0.12；增大排除小毛刺，也更易无补线。
  roundabout_exit_corner_min_span_ratio: 0.12
  # 右边界张开/拐点横向变化最小占图宽比例，(0,1]，默认0.08；增大更严，减小易把抖动当拐点。
  # 已确认EXIT后有效虚拟右边界在屏幕画紫色线；exit_corner=1才表示本帧实际使用。
  roundabout_exit_corner_min_shift_ratio: 0.08

  # ===== G. 人行横道：正常出环或30/45秒兜底后开启；停车后忽略条纹直行 =====
  # 0关闭横道任务；1开启，默认1。开启后环岛->横道->下一环岛有明确顺序，不能提前停车。
  crosswalk_enabled: 1
  # 连续确认的新帧数，整数1..20，默认2；增大抗误检，过大高速漏检。不重复计同一旧图。
  crosswalk_confirm_frames: 2
  # 同一横向采样带至少几条相似黑条，整数2..12，默认4；降低更易识别但误判风险增大。
  # 单根巡线黑线不当横道；还要求黑条间有亮色空隙、宽度相近和覆盖跨度。
  crosswalk_min_stripes: 4
  # 至少几条采样带满足横道排列，整数1..40，默认3；减小更快响应，过小误检。
  crosswalk_good_rows: 3
  # 横道观察区域上下界，占整图高度0..1；上小看远、下大覆盖近景，必须top<bottom。
  crosswalk_roi_top_ratio: 0.24
  crosswalk_roi_bottom_ratio: 0.82
  # 黑条排列至少横跨ROI宽度比例(0,1]，默认0.35；减小容易发现偏侧横道，也易误判。
  crosswalk_min_span_ratio: 0.35
  # 正常视觉出环后最少延迟s>=0，默认1.5，两圈都用；时间兜底到点后不再额外等这1.5秒。
  crosswalk_delay_after_roundabout: 1.5
  # 横道额外最小时间门s>=0：0不额外限制，按正常出环/时间放行顺序；不等于上面的环岛30/45秒兜底。
  # first从本场开始算，repeat从上次横道确认算；停车暂停时间不算活动时间。
  crosswalk_first_min_seconds: 0.0
  crosswalk_repeat_min_seconds: 0.0
  # 横道强视觉提前放行开关：0仅正常出环/30或45秒兜底；1允许下列等待时长后用更严条纹证据提前放行。
  # 仅SEEK/APPROACH/等总期限阶段可用，ENTRY/FOLLOW/EXIT内不会用横道抢环岛控制；不等于到点停车。
  crosswalk_visual_release_enabled: 0
  # 提前放行最小活动时间，秒>=0，默认18；首次从比赛开始算，第二次从第一次横道确认算。
  # 本次日志第二条纹高分约在第一次后21秒，45秒等太久；18只是调试起值，未实车标定。
  # 人工暂停不算，第一次停车/清线不会被打断；过小容易把赛道其它图案当横道。
  crosswalk_visual_release_seconds: 18.0
  # 提前放行连续真实新帧数，整数2~20，默认3；中断/超过0.20秒/暂停清零，不把几次闪现累加。
  # 正常已出环的横道仍用crosswalk_confirm_frames，提前放行用本项更严格。
  crosswalk_visual_release_frames: 3
  # 提前放行同采样带至少多少相似黑条，整数4~12，默认5；实际取本项与普通min_stripes较大者。
  # 仍要亮间隔/跨度/相似宽度和多采样带；不是一根条纹就停车。增大减少误停但可能漏检。
  crosswalk_visual_release_min_stripes: 5
  # 第一次横道确认后继续前进m>=0，默认0.25，再停车；增大停更靠后，过大压条纹。
  # 此段保持确认时的朝向，不再被其它黑条牵引；无新鲜odom则角速度0直行。
  crosswalk_approach_distance_m: 0.25
  # 第一次横道零轮速停车时长s，0..15，默认3；保持平衡姿态，不关闭底盘。
  crosswalk_stop_seconds: 3.0
  # 停车后忽略黑条/普通巡线直行的秒数，0..6，默认3；时间到才恢复正常循迹，不遗漏此阶段。
  # 0.65m/s持续3秒约1.95m，请确认横道后有足够直道；不足时减小时长或明确设下方清线速度。
  crosswalk_clear_seconds: 3.0
  # 清线速度m/s>=0，0=沿用正常fixed_speed_m_s（默认，不给第二圈加慢速档）；>0仅清线段按该值。
  crosswalk_clear_speed_m_s: 0.0
  # 接近/清线/终点冲线的航向保持增益，rad/s每rad，>=0，默认1.2；增大纠方向快，过大会摆。
  # 受显式max_turn_rad_s约束；无新鲜odom不使用旧偏航，改为角速度0。
  crosswalk_heading_gain: 1.2
  # 1=第二次合法横道确认后直接按距离冲线结束（按之前要求）；0=每次停车清线后继续循环。
  finish_after_second_crosswalk: 1
  # 从第二次横道确认位置开始的冲线距离m>=0，默认1.0；期间保持确认朝向、不被条纹带偏，达到后停车。
  second_crosswalk_finish_distance_m: 1.0
  # 横道接近/终点冲线最长运动秒数>0，默认12；无有效行程进展则故障等待，不靠超时冒充走够距离。
  crosswalk_task_max_seconds: 12.0

  # ===== H. 显示与正常姿态：本轮不擅自抬高车身 =====
  # 车载屏幕刷新目标fps，>0；降低减少绘图开销，不降低算法处理频率。相机/控制仍用原30Hz配置。
  display_fps: 10.0
  # 正常姿态：沿用原包0.15m/25°；保存后0.5秒平滑过渡，不能超出底盘接口范围。
  # 腿高m，0.14..0.36；减小下蹲、增大抬高。
  posture_height_m: 0.15
  # 横滚度，-15..15；正负方向以实车为准，通常保持0。
  posture_roll_deg: 0.0
  # 俯仰度，-35..35；本车正值低头，增大更看近端。
  posture_pitch_deg: 25.0
  # 滑步m，-0.08..0.08；方向以实车为准，通常保持0。
  posture_slide_m: 0.0
